<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CO-ORD | Active Sprint Board</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="h-screen flex flex-col text-slate-800 font-sans selection:bg-indigo-100 selection:text-indigo-900 overflow-hidden">

    <!-- Top Navigation HUD -->
    <header class="h-24 bg-white/70 backdrop-blur-2xl border-b-2 border-white/80 flex items-center justify-between px-6 sm:px-10 z-30 shrink-0 shadow-[0_10px_30px_-10px_rgba(15,23,42,0.03)]">
        <div class="flex items-center gap-4">
            <a href="dashboard.html" class="group flex items-center gap-3 bg-white border-2 border-slate-100 px-5 py-2.5 rounded-2xl shadow-sm hover:shadow-md hover:border-indigo-200 transition-all">
                <span class="text-slate-400 group-hover:-translate-x-1 transition-transform font-black">←</span>
                <span class="text-xs font-black text-slate-700 uppercase tracking-widest">Back to Hub</span>
            </a>
            <div class="hidden md:flex items-center gap-2 bg-slate-900 text-white px-4 py-2 rounded-2xl font-black text-sm tracking-wider">
                <span class="text-indigo-400">❖</span> CO-ORD
            </div>
        </div>
        
        <div class="flex items-center gap-4 sm:gap-8">
            <!-- Dynamic Token Vault Counter -->
            <div id="token-vault-hud" class="flex items-center gap-2.5 bg-gradient-to-r from-amber-50 to-indigo-50 border-2 border-indigo-100/80 px-4 py-2 rounded-2xl shadow-sm transition-transform duration-300">
                <span class="text-2xl drop-shadow-sm">🪙</span>
                <div>
                    <span id="active-tokens-count" class="hud-tokens font-black text-slate-900 text-base tracking-tight block leading-none">150 Tokens</span>
                    <span class="text-[9px] font-black uppercase tracking-wider text-emerald-600">Verified Economy</span>
                </div>
            </div>

            <!-- User Profile Identity -->
            <div class="flex items-center gap-3 border-l-2 border-slate-200/80 pl-4 sm:pl-6">
                <div class="text-right hidden sm:block">
                    <div class="hud-user-name font-black text-sm text-slate-900">Anisha S</div>
                    <div class="hud-user-role text-[10px] font-black text-slate-400 uppercase tracking-widest">Frontend Lead</div>
                </div>
                <div class="w-10 h-10 bg-gradient-to-tr from-indigo-500 to-purple-500 rounded-xl border-2 border-white shadow-md hud-user-avatar"></div>
            </div>
        </div>
    </header>

    <!-- PROJECT HEADER & SPRINT TELEMETRY -->
    <div class="px-6 sm:px-10 py-4 shrink-0 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <div>
            <div class="flex items-center gap-3 mb-1">
                <span id="sprint-tag-label" class="text-[10px] font-black text-indigo-600 uppercase tracking-widest bg-indigo-50 px-2.5 py-0.5 rounded-full border border-indigo-100">
                    Sprint 04 - Alpha Orchestration
                </span>
                <span class="text-slate-300">•</span>
                <span class="text-xs font-bold text-slate-500 flex items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    vLLM Neural Router Active
                </span>
            </div>
            <h1 id="project-title-header" class="font-black text-2xl sm:text-3xl text-slate-900 tracking-tight">
                AI Community Complaint Prioritizer
            </h1>
        </div>

        <div class="flex items-center gap-3">
            <!-- Filter Dropdown -->
            <select id="domain-filter" onchange="filterTasks()" class="igloo-input px-3.5 py-2 text-xs font-black text-slate-700">
                <option value="ALL">All Domains</option>
                <option value="Frontend">Frontend</option>
                <option value="Backend">Backend</option>
                <option value="AI/ML">AI / ML</option>
                <option value="UI/UX">UI / UX</option>
            </select>

            <!-- Quick Add Task Button -->
            <button onclick="openAddTaskModal()" class="tactile-btn tactile-btn-primary px-4 py-2.5 text-xs flex items-center gap-2">
                <span>+ Quick Task</span>
            </button>
        </div>
    </div>

    <!-- MAIN 3D KANBAN BOARD (3 COLUMNS) -->
    <main class="flex-1 flex flex-col md:flex-row gap-6 px-6 sm:px-10 pb-6 overflow-hidden z-10 relative">
        
        <!-- Column 1: Pending Tasks -->
        <div class="flex-1 igloo-bento-subtle p-5 flex flex-col h-full bg-slate-50/70 border-slate-200">
            <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-200/60 shrink-0">
                <div class="flex items-center gap-2">
                    <div class="w-3 h-3 rounded-full bg-amber-400"></div>
                    <h2 class="font-black text-xs uppercase tracking-widest text-slate-700">Pending Tasks</h2>
                </div>
                <span id="badge-count-pending" class="bg-white border-2 border-slate-100 text-slate-700 font-black text-xs px-2.5 py-0.5 rounded-xl shadow-sm">
                    0
                </span>
            </div>

            <!-- Task List Container -->
            <div id="col-pending" class="flex-1 overflow-y-auto space-y-4 pr-1">
                <!-- Dynamically rendered -->
            </div>
        </div>

        <!-- Column 2: In Progress -->
        <div class="flex-1 igloo-bento p-5 flex flex-col h-full border-indigo-200 shadow-md">
            <div class="flex justify-between items-center mb-4 pb-2 border-b border-indigo-100 shrink-0">
                <div class="flex items-center gap-2">
                    <div class="w-3 h-3 rounded-full bg-indigo-600 animate-pulse"></div>
                    <h2 class="font-black text-xs uppercase tracking-widest text-indigo-800">In Progress</h2>
                </div>
                <span id="badge-count-in-progress" class="bg-indigo-100 text-indigo-800 font-black text-xs px-2.5 py-0.5 rounded-xl shadow-sm">
                    0
                </span>
            </div>

            <!-- Task List Container -->
            <div id="col-in-progress" class="flex-1 overflow-y-auto space-y-4 pr-1">
                <!-- Dynamically rendered -->
            </div>
        </div>

        <!-- Column 3: Completed -->
        <div class="flex-1 igloo-bento-subtle p-5 flex flex-col h-full bg-emerald-50/30 border-emerald-200/60">
            <div class="flex justify-between items-center mb-4 pb-2 border-b border-emerald-100 shrink-0">
                <div class="flex items-center gap-2">
                    <div class="w-3 h-3 rounded-full bg-emerald-500"></div>
                    <h2 class="font-black text-xs uppercase tracking-widest text-emerald-800">Completed & Verified</h2>
                </div>
                <span id="badge-count-completed" class="bg-emerald-100 text-emerald-800 font-black text-xs px-2.5 py-0.5 rounded-xl shadow-sm">
                    0
                </span>
            </div>

            <!-- Task List Container -->
            <div id="col-completed" class="flex-1 overflow-y-auto space-y-4 pr-1">
                <!-- Dynamically rendered -->
            </div>
        </div>

    </main>

    <!-- QUICK ADD TASK MODAL -->
    <div id="task-modal" class="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="igloo-bento p-8 max-w-lg w-full bg-white shadow-2xl relative">
            <div class="flex justify-between items-center mb-6">
                <h3 class="font-black text-xl text-slate-900 flex items-center gap-2">
                    <span>⚡</span> Add Task to Sprint
                </h3>
                <button onclick="closeAddTaskModal()" class="text-slate-400 hover:text-slate-700 font-black text-lg">✕</button>
            </div>

            <form onsubmit="event.preventDefault(); submitNewTask();" class="space-y-4">
                <div>
                    <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1">Task Title</label>
                    <input id="new-task-title" type="text" required placeholder="e.g., Benchmark token latency on GPU nodes" class="w-full igloo-input px-4 py-2.5 text-xs font-bold text-slate-800">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1">Domain</label>
                        <select id="new-task-domain" class="w-full igloo-input px-3 py-2 text-xs font-bold text-slate-800">
                            <option value="Frontend">Frontend</option>
                            <option value="Backend">Backend</option>
                            <option value="AI/ML">AI / ML</option>
                            <option value="UI/UX">UI / UX</option>
                            <option value="DevOps">DevOps</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1">Token Bounty</label>
                        <input id="new-task-bounty" type="number" min="10" max="200" value="40" class="w-full igloo-input px-3 py-2 text-xs font-bold text-slate-800">
                    </div>
                </div>

                <div>
                    <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1">Auto-Assign via vLLM or Select Node</label>
                    <select id="new-task-assignee" class="w-full igloo-input px-3 py-2 text-xs font-bold text-slate-800">
                        <!-- Populated by JS -->
                    </select>
                </div>

                <div class="pt-4 flex gap-3">
                    <button type="button" onclick="closeAddTaskModal()" class="flex-1 py-3 text-xs font-black uppercase tracking-wider text-slate-500 hover:bg-slate-100 rounded-xl">Cancel</button>
                    <button type="submit" class="flex-1 tactile-btn tactile-btn-primary py-3 text-xs">Deploy Task</button>
                </div>
            </form>
        </div>
    </div>

    <script src="coord-store.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            renderSprintHeader();
            renderKanbanBoard();
        });

        function renderSprintHeader() {
            const proj = CoordStore.getCurrentProject();
            const titleEl = document.getElementById('project-title-header');
            const tagEl = document.getElementById('sprint-tag-label');

            if (titleEl && proj.title) titleEl.innerText = proj.title;
            if (tagEl && proj.activeSprint) tagEl.innerText = proj.activeSprint;
        }

        function filterTasks() {
            renderKanbanBoard();
        }

        function renderKanbanBoard() {
            const tasks = CoordStore.getTasks();
            const team = CoordStore.getTeam();
            const filterDomain = document.getElementById('domain-filter').value;

            const colPending = document.getElementById('col-pending');
            const colInProgress = document.getElementById('col-in-progress');
            const colCompleted = document.getElementById('col-completed');

            colPending.innerHTML = "";
            colInProgress.innerHTML = "";
            colCompleted.innerHTML = "";

            let countPending = 0;
            let countInProgress = 0;
            let countCompleted = 0;

            const filteredTasks = tasks.filter(t => {
                if (filterDomain === 'ALL') return true;
                return t.domain === filterDomain;
            });

            filteredTasks.forEach(task => {
                const assignedMember = team.find(m => m.id === task.assignedTo) || {
                    name: 'Unassigned',
                    role: 'Cluster Node',
                    avatarGradient: 'from-slate-400 to-slate-500'
                };

                const card = document.createElement('div');
                card.id = `card-${task.id}`;
                card.className = "task-card bg-white border-2 border-slate-100 p-5 shadow-sm relative group";

                // Subtask checklist HTML
                const subtasksHtml = (task.subtasks || []).map((st, i) => `
                    <div class="flex items-center gap-2 text-[11px] text-slate-600 font-semibold cursor-pointer" onclick="toggleSubtaskStatus('${task.id}', ${i})">
                        <input type="checkbox" ${st.done ? 'checked' : ''} class="w-3.5 h-3.5 rounded text-indigo-600 focus:ring-0 pointer-events-none">
                        <span class="${st.done ? 'line-through text-slate-400' : ''}">${st.text}</span>
                    </div>
                `).join('');

                // Action buttons based on column
                let actionBtnHtml = '';
                if (task.status === 'pending') {
                    countPending++;
                    actionBtnHtml = `
                        <div class="flex items-center gap-2">
                            <button onclick="requestRebalance('${task.id}')" title="Ask vLLM to find alternative node" class="p-2 text-slate-400 hover:text-indigo-600 rounded-xl hover:bg-indigo-50 text-xs">
                                🔄
                            </button>
                            <button onclick="moveTask('${task.id}', 'in-progress')" class="tactile-btn tactile-btn-primary px-4 py-2 text-[10px]">
                                Start Work →
                            </button>
                        </div>
                    `;
                    card.classList.add('hover:border-indigo-100');
                    colPending.appendChild(card);

                } else if (task.status === 'in-progress') {
                    countInProgress++;
                    actionBtnHtml = `
                        <div class="flex items-center gap-2">
                            <button onclick="moveTask('${task.id}', 'pending')" title="Return to Pending" class="p-2 text-slate-400 hover:text-slate-600 rounded-xl hover:bg-slate-100 text-xs">
                                ←
                            </button>
                            <button onclick="completeTaskWithBounty('${task.id}', ${task.bounty})" class="tactile-btn tactile-btn-emerald px-4 py-2 text-[10px]">
                                Complete 🪙
                            </button>
                        </div>
                    `;
                    card.classList.add('border-indigo-200', 'shadow-md', 'shadow-indigo-100/50');
                    colInProgress.appendChild(card);

                } else if (task.status === 'completed') {
                    countCompleted++;
                    actionBtnHtml = `
                        <div class="flex items-center gap-2">
                            <span class="bg-emerald-50 text-emerald-700 border border-emerald-200 text-[10px] font-black px-3 py-1.5 rounded-xl uppercase tracking-wider">
                                ✓ Bounty Claimed
                            </span>
                            <button onclick="moveTask('${task.id}', 'in-progress')" title="Reopen Task" class="p-1.5 text-slate-400 hover:text-slate-600 text-xs">
                                ↩
                            </button>
                        </div>
                    `;
                    card.classList.add('opacity-75', 'bg-slate-50/50');
                    colCompleted.appendChild(card);
                }

                // Domain badge colors
                let domainBadge = 'bg-indigo-50 text-indigo-700';
                if (task.domain === 'Backend') domainBadge = 'bg-orange-50 text-orange-700';
                if (task.domain === 'AI/ML') domainBadge = 'bg-purple-50 text-purple-700';
                if (task.domain === 'UI/UX') domainBadge = 'bg-pink-50 text-pink-700';

                card.innerHTML = `
                    <div class="flex justify-between items-start mb-2.5">
                        <span class="${domainBadge} text-[10px] font-black px-3 py-1 rounded-xl uppercase tracking-wider">
                            ${task.domain || 'General'}
                        </span>
                        <span class="font-black text-emerald-700 bg-emerald-50 border border-emerald-100 px-3 py-1 rounded-xl text-xs flex items-center gap-1 shadow-sm">
                            🪙 +${task.bounty}
                        </span>
                    </div>

                    <h3 class="font-black text-sm text-slate-900 leading-snug mb-2.5">${task.title}</h3>

                    <!-- Subtask Checklist -->
                    <div class="space-y-1.5 mb-3.5 bg-slate-50/70 p-2.5 rounded-2xl border border-slate-100">
                        ${subtasksHtml}
                    </div>

                    <!-- vLLM Rationale Pill -->
                    <div class="bg-indigo-50/50 border border-indigo-100/70 p-2 rounded-xl text-[10px] font-bold text-indigo-800/80 mb-3.5 flex items-start gap-1.5">
                        <span class="text-indigo-500">✨</span>
                        <span>${task.vllmRationale || 'vLLM Routing: Assigned by neural vector similarity.'}</span>
                    </div>

                    <!-- Teammate & Action Footer -->
                    <div class="flex justify-between items-center pt-2 border-t border-slate-100">
                        <div class="flex items-center gap-2">
                            <div class="w-6 h-6 bg-gradient-to-tr ${assignedMember.avatarGradient || 'from-indigo-500 to-purple-500'} rounded-full border-2 border-white shadow-sm flex items-center justify-center text-white text-[9px] font-black">
                                ${assignedMember.name.charAt(0)}
                            </div>
                            <div>
                                <span class="text-xs font-black text-slate-800 block leading-none">${assignedMember.name}</span>
                                <span class="text-[9px] font-bold text-slate-400 uppercase">${assignedMember.role}</span>
                            </div>
                        </div>
                        ${actionBtnHtml}
                    </div>
                `;
            });

            // Update badge counters
            document.getElementById('badge-count-pending').innerText = countPending;
            document.getElementById('badge-count-in-progress').innerText = countInProgress;
            document.getElementById('badge-count-completed').innerText = countCompleted;
        }

        function moveTask(taskId, newStatus) {
            CoordStore.updateTaskStatus(taskId, newStatus);
            renderKanbanBoard();
        }

        function completeTaskWithBounty(taskId, bounty) {
            // 1. Move to completed
            CoordStore.updateTaskStatus(taskId, 'completed');
            
            // 2. Add Tokens to Vault
            const newTotal = CoordStore.addTokens(bounty);

            // 3. Play Visual Celebration Pop Effect
            const vault = document.getElementById('token-vault-hud');
            if (vault) {
                vault.classList.add('animate-token-pop', 'bg-emerald-100', 'border-emerald-300');
                setTimeout(() => {
                    vault.classList.remove('animate-token-pop', 'bg-emerald-100', 'border-emerald-300');
                }, 500);
            }

            renderKanbanBoard();
        }

        function toggleSubtaskStatus(taskId, subtaskIndex) {
            CoordStore.toggleSubtask(taskId, subtaskIndex);
            renderKanbanBoard();
        }

        function requestRebalance(taskId) {
            const tasks = CoordStore.getTasks();
            const task = tasks.find(t => t.id === taskId);
            if (!task) return;

            const rec = CoordStore.recommendMemberForTask([task.domain, 'Optimization'], task.domain);
            if (rec && rec.member) {
                task.assignedTo = rec.member.id;
                task.vllmRationale = `vLLM Rebalance: Dynamically re-routed to ${rec.member.name} (${rec.score}% match, load optimal).`;
                CoordStore.setTasks(tasks);
                CoordStore.recalculateMemberCapacities();
                renderKanbanBoard();
            }
        }

        // Modal Handlers
        function openAddTaskModal() {
            const select = document.getElementById('new-task-assignee');
            const team = CoordStore.getTeam();
            select.innerHTML = `<option value="">Auto-Assign via vLLM Recommendation</option>`;
            team.forEach(m => {
                select.innerHTML += `<option value="${m.id}">${m.name} (${m.role})</option>`;
            });
            document.getElementById('task-modal').classList.remove('hidden');
        }

        function closeAddTaskModal() {
            document.getElementById('task-modal').classList.add('hidden');
        }

        function submitNewTask() {
            const title = document.getElementById('new-task-title').value.trim();
            const domain = document.getElementById('new-task-domain').value;
            const bounty = parseInt(document.getElementById('new-task-bounty').value, 10) || 40;
            const manualAssignee = document.getElementById('new-task-assignee').value;

            let assignedId = manualAssignee;
            let rationale = 'Manually routed by project lead.';

            if (!assignedId) {
                const rec = CoordStore.recommendMemberForTask([domain], domain);
                if (rec && rec.member) {
                    assignedId = rec.member.id;
                    rationale = `vLLM Engine: Auto-routed to ${rec.member.name} with ${rec.score}% compatibility score.`;
                }
            }

            CoordStore.addTask({
                title,
                domain,
                bounty,
                assignedTo: assignedId,
                status: 'pending',
                vllmRationale: rationale,
                subtasks: [
                    { text: 'Analyze task requirements', done: false },
                    { text: 'Implement deliverable', done: false },
                    { text: 'Verify output quality', done: false }
                ]
            });

            closeAddTaskModal();
            renderKanbanBoard();
        }
    </script>
</body>
</html>
