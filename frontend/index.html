<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CO-ORD | AI-Powered Task Orchestration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-6 overflow-x-hidden selection:bg-indigo-100 selection:text-indigo-900 relative">

    <!-- The 3D Moving Perspective Grid Floor -->
    <div class="grid-perspective-container">
        <div class="grid-3d-plane"></div>
    </div>

    <!-- Floating 3D Decorative Bento Pillow Orbs -->
    <div class="float-pillow w-28 h-28 top-16 left-16 hidden lg:flex items-center justify-center text-4xl shadow-xl" style="animation-delay: 0s;">
        <span class="opacity-80">🧊</span>
    </div>
    <div class="float-pillow w-36 h-20 bottom-16 right-20 hidden lg:flex items-center justify-center gap-3 px-4 shadow-xl" style="animation-delay: 2s;">
        <div class="w-3 h-3 bg-emerald-500 rounded-full animate-pulse shadow-[0_0_12px_rgba(16,185,129,0.8)]"></div>
        <span class="text-[11px] font-black tracking-widest text-slate-700 uppercase">vLLM Node</span>
    </div>
    <div class="float-pillow w-20 h-20 bottom-28 left-28 hidden xl:flex items-center justify-center text-3xl shadow-xl" style="animation-delay: 3.5s;">
        <span class="opacity-80">⚡</span>
    </div>

    <!-- The 3D Tilt Interactive Wrapper -->
    <div id="tilt-wrapper" class="w-full max-w-lg z-10 will-change-transform transform-gpu transition-transform duration-100 ease-out" style="perspective: 1200px;">
        
        <!-- The Soft Pillow Bento Card (Igloo Style) -->
        <div id="auth-card" class="igloo-bento p-8 sm:p-12 relative overflow-hidden bg-white/95 backdrop-blur-xl">
            
            <!-- Inset Top Glow Effect -->
            <div class="absolute -top-24 left-1/2 -translate-x-1/2 w-64 h-32 bg-indigo-200/40 rounded-full blur-3xl pointer-events-none"></div>

            <!-- Card Header -->
            <div class="text-center mb-8 relative z-10">
                <div class="inline-flex items-center gap-3 bg-slate-900 text-white px-6 py-2.5 rounded-2xl font-black text-2xl tracking-widest mb-3 border-2 border-slate-800 shadow-[0_8px_20px_-4px_rgba(15,23,42,0.35)]">
                    <span class="text-indigo-400">❖</span> CO-ORD
                </div>
                
                <p class="text-slate-400 font-extrabold text-xs uppercase tracking-widest mt-1">Autonomous Task Orchestrator</p>

                <!-- AI Typewriter Target -->
                <div class="mt-4 flex items-center justify-center gap-2 bg-indigo-50/80 border border-indigo-100/80 px-4 py-2 rounded-full w-fit mx-auto shadow-sm">
                    <div class="w-2 h-2 bg-indigo-600 rounded-full animate-pulse"></div>
                    <span id="typewriter-text" class="text-indigo-700 text-xs font-black tracking-wider uppercase">Connecting to vLLM Engine...</span>
                    <span class="terminal-cursor !h-3.5 !w-1.5 !bg-indigo-600"></span>
                </div>
            </div>

            <!-- Toggle Switch (Login vs Register) -->
            <div class="flex bg-slate-100/90 p-1.5 rounded-2xl mb-8 border border-slate-200/70 relative shadow-inner">
                <button type="button" id="tab-login" onclick="switchAuthTab(true)" class="flex-1 py-2.5 rounded-xl text-xs font-black uppercase tracking-wider transition-all duration-300 bg-white text-slate-900 shadow-sm">
                    Existing Node
                </button>
                <button type="button" id="tab-register" onclick="switchAuthTab(false)" class="flex-1 py-2.5 rounded-xl text-xs font-black uppercase tracking-wider transition-all duration-300 text-slate-500 hover:text-slate-900">
                    Initialize Node
                </button>
            </div>

            <!-- Container for sliding forms -->
            <div class="relative min-h-[300px]">
                
                <!-- 1. LOGIN FORM -->
                <form id="login-form" onsubmit="event.preventDefault(); submitLogin();" class="w-full transition-all duration-500 ease-out translate-x-0 opacity-100">
                    <div class="space-y-5">
                        <div>
                            <label class="block text-[11px] font-black text-slate-500 uppercase tracking-widest mb-2 ml-1">Team Node Identifier / Email</label>
                            <input id="login-email" type="text" value="anisha@coord.app" required placeholder="name@coord.app" class="w-full igloo-input px-5 py-3.5 text-sm font-bold text-slate-800">
                        </div>
                        <div>
                            <div class="flex justify-between items-center mb-2 ml-1">
                                <label class="block text-[11px] font-black text-slate-500 uppercase tracking-widest">Access Key</label>
                                <span class="text-[10px] font-bold text-indigo-600 cursor-pointer hover:underline">Auto-provisioned</span>
                            </div>
                            <input id="login-pass" type="password" value="coord-vllm-2026" required placeholder="••••••••" class="w-full igloo-input px-5 py-3.5 text-sm font-bold text-slate-800">
                        </div>
                    </div>
                    
                    <button type="submit" id="login-submit-btn" class="tactile-btn tactile-btn-primary w-full py-4 mt-8 text-sm flex items-center justify-center gap-3">
                        <span>Enter System Hub</span>
                        <span class="text-base leading-none">→</span>
                    </button>

                    <div class="mt-6 text-center">
                        <span class="text-xs font-bold text-slate-400">Pre-authenticated with Cluster Llama-3.3 • </span>
                        <span class="text-xs font-black text-emerald-600">Zero Trust TLS</span>
                    </div>
                </form>

                <!-- 2. SIGN UP / INITIALIZE FORM -->
                <form id="signup-form" onsubmit="event.preventDefault(); submitRegister();" class="w-full absolute top-0 left-0 transition-all duration-500 ease-out translate-x-full opacity-0 pointer-events-none">
                    <div class="space-y-4">
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1.5 ml-1">Full Name</label>
                                <input id="reg-name" type="text" required placeholder="e.g., Sarah Chen" class="w-full igloo-input px-4 py-2.5 text-xs font-bold text-slate-800">
                            </div>
                            <div>
                                <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1.5 ml-1">Node Role</label>
                                <select id="reg-role" class="w-full igloo-input px-3 py-2.5 text-xs font-bold text-slate-800">
                                    <option value="Frontend Lead">Frontend Lead</option>
                                    <option value="Backend Architect">Backend Architect</option>
                                    <option value="AI / LLM Engineer">AI / LLM Engineer</option>
                                    <option value="UI/UX Designer">UI/UX Designer</option>
                                    <option value="DevOps Specialist">DevOps Specialist</option>
                                </select>
                            </div>
                        </div>

                        <div>
                            <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1.5 ml-1">Work Email</label>
                            <input id="reg-email" type="email" required placeholder="sarah@coord.app" class="w-full igloo-input px-4 py-2.5 text-xs font-bold text-slate-800">
                        </div>
                        
                        <div>
                            <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1.5 ml-1">Skill Matrix Tags (For vLLM Semantic Match)</label>
                            <input id="reg-skills" type="text" required placeholder="Python, FastAPI, Docker, PyTorch" class="w-full igloo-input px-4 py-2.5 text-xs font-bold text-slate-800">
                        </div>
                    </div>
                    
                    <button type="submit" id="signup-submit-btn" class="tactile-btn tactile-btn-dark w-full py-4 mt-6 text-sm flex items-center justify-center gap-3">
                        <span>Register Node & Join</span>
                        <span class="text-base leading-none">→</span>
                    </button>

                    <div class="mt-4 text-center">
                        <span class="text-[11px] font-bold text-slate-400">Node will be immediately indexed into vLLM embedding router</span>
                    </div>
                </form>

            </div>

        </div>
    </div>

    <script src="coord-store.js"></script>
    <script src="script.js"></script>
</body>
</html>
